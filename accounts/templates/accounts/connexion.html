{% extends "base.html" %}
{% block titre %}Connexion{% endblock %}
{% block contenu %}
<h1>Connexion</h1>
{% if erreur %}<p role="alert">{{ erreur }}</p>{% endif %}
<form method="post">
  {% csrf_token %}
  <p><label>Identifiant <input name="username" required autocomplete="username"></label></p>
  <p><label>Mot de passe <input type="password" name="password" required autocomplete="current-password"></label></p>
  <button type="submit">Se connecter</button>
</form>
{% endblock %}
